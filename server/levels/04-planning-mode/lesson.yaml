id: "planning-mode"
number: 4
module: "Planning"
track: "advanced"
title: "Plan Mode for Complex Features"

video:
  url: "https://youtu.be/30wRU1tYs8Q"
  duration_seconds: 300

exercise:
  intro: |
    Use plan mode to implement the reports module - a multi-file feature.
  objective: "Use plan mode to implement monthly expense reports"

intro: |
  Plan mode is for complex, multi-step features.

  The reports module (reports.py) is empty - it raises NotImplementedError.

  Use plan mode to implement:
  - generate_monthly_report()
  - get_category_breakdown()
  - get_top_expenses()
  - save_report()

  Type: claude

  Press Shift+Tab to toggle plan mode, then say:
  "Implement the reports module with monthly reports, category breakdown, and top expenses"

verification:
  - type: command_output
    description: "Implement generate_monthly_report()"
    command: "python3 -c \"from reports import generate_monthly_report;\ntry:\n generate_monthly_report()\n print('OK')\nexcept NotImplementedError:\n print('STUB')\nexcept Exception:\n print('OK')\" 2>&1"
    expected_output: "OK"
  - type: command_output
    description: "Implement get_category_breakdown()"
    command: "python3 -c \"from reports import get_category_breakdown;\ntry:\n get_category_breakdown([])\n print('OK')\nexcept NotImplementedError:\n print('STUB')\nexcept Exception:\n print('OK')\" 2>&1"
    expected_output: "OK"

success: |
  You used plan mode for a complex feature!

  1. Entered plan mode (Shift+Tab)
  2. Described the feature
  3. Reviewed the plan
  4. Approved and implemented

  Test it: python -c "from reports import generate_monthly_report; print(generate_monthly_report('2026-01'))"

limits:
  max_duration_minutes: 20
  max_claude_messages: 30
