id: "mcp-servers"
number: 8
module: "Extensions"
track: "advanced"
title: "MCP Servers (External Sources)"

video:
  url: "https://youtu.be/r3CuQHbMLPw"
  duration_seconds: 300

exercise:
  intro: |
    Connect Claude to external data sources using MCP (Model Context Protocol).
  objective: "Install an MCP server and use it to fetch external data"

intro: |
  MCP servers connect Claude to external tools and data sources.

  Remember Lesson 1? Claude trusted outdated Firecrawl docs and wrote
  broken v1 code. MCP servers solve this — they let Claude fetch live
  data from external sources.

  Let's fix Lesson 1's problem with context7 (a documentation MCP):

  1. Start Claude: `claude`
  2. Install context7:
     "Add the context7 MCP server using:
     claude mcp add context7 -- npx -y @upstash/context7-mcp@latest"
  3. IMPORTANT: Exit Claude (Ctrl+C) and restart it.
     MCP tools only load on startup — you must restart to use them.
  4. Now ask the SAME question from Lesson 1:
     "Write a function that scrapes a URL using the Firecrawl Python SDK"
  5. Watch Claude fetch the current Firecrawl docs via context7
     → It should use the correct v2 API (Firecrawl, scrape, etc.)
     → Not the outdated v1 API from the docs/ folder

  The MCP gives Claude access to current documentation automatically.

verification:
  - type: message_exists

success: |
  You connected Claude to live documentation!

  Compare to Lesson 1:
  - Without MCP: Claude used outdated docs → broken v1 code
  - With context7: Claude fetched current docs → correct v2 code

  MCP servers extend Claude's reach beyond its training data:
  - context7: Live library documentation
  - postgres: Database queries
  - github: Repository management
  - slack: Team communication

  Any API can become an MCP server. Check your servers:
  claude mcp list

limits:
  max_duration_minutes: 15
  max_claude_messages: 20
