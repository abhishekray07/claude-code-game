id: "claude-md"
number: 2
module: "Mental Model"
title: "CLAUDE.md - Your Project's Memory"

video:
  url: "https://vimeo.com/placeholder"
  duration_seconds: 300

exercise:
  intro: |
    Claude forgets everything between sessions. CLAUDE.md is how you fix that.
  objective: "Create a CLAUDE.md that gives Claude persistent project context"

intro: |
  Claude has zero memory between sessions. CLAUDE.md fixes this.

  It's loaded automatically at the start of every conversation.

  Experiment:

  1. Start Claude: `claude`
  2. Ask: "How do I run the tests for this project?"
     → Claude doesn't know. It has to scan through your code to figure it out.
  3. Run: `/init`
     → Claude scans your project and creates CLAUDE.md for you.
  4. Exit Claude (Ctrl+C or type "exit")
  5. Start a new session: `claude`
  6. Ask the same question: "How do I run the tests?"
     → Claude knows immediately — it read CLAUDE.md on startup.

  Think of CLAUDE.md as your project's memory:
  - What would a new teammate need to know on day one?
  - What mistakes do people keep making?
  - What's non-obvious about your setup?

  Keep it under 40-60 lines. Claude's system prompt already has ~50
  instructions. Every line you add competes for attention.

verification:
  - type: file_contains
    description: "Create CLAUDE.md with test instructions"
    path: "CLAUDE.md"
    pattern: "(pytest|test)"

success: |
  You created your project's memory!

  CLAUDE.md best practices:
  - Keep it under 40-60 lines (attention budget)
  - Include: stack, commands, conventions, gotchas
  - Exclude: anything Claude can figure out from code
  - Every "Don't X" should include "Do Y instead"
  - Update it when Claude makes repeated mistakes

  CLAUDE.md is the highest-leverage file in your project.

limits:
  max_duration_minutes: 15
  max_claude_messages: 30
