id: "hooks"
number: 10
module: "Automation"
title: "Hooks"

video:
  url: "https://youtu.be/4pKfp7B0oWo"
  duration_seconds: 300

exercise:
  intro: |
    Hooks let you intercept and validate Claude's actions.
    You'll create a hook to block dangerous commands.
  objective: "Create a hook to block dangerous commands"

intro: |
  Hooks run before/after Claude executes commands.

  Use them to:
  - Block dangerous commands (rm -rf, git push --force)
  - Require confirmation for risky operations
  - Run linters after edits
  - Notify on commits

  Create a hook to block rm -rf:

  1. Start Claude: `claude`
  2. Say: "Look up the Claude Code documentation for how to create hooks,
     then create a hook that blocks any Bash command containing 'rm -rf'.
     Put the script in .claude/hooks/block-dangerous.sh"

  After creating, test it by asking Claude to run: rm -rf test
  (it should be blocked!)

verification:
  - type: glob_exists
    description: "Create a hook script"
    pattern: ".claude/hooks/*.sh"
  - type: file_contains
    description: "Register hook in settings"
    path: ".claude/settings.json"
    pattern: "hooks"

success: |
  You created a hook!

  Common hook patterns:
  - PreToolUse: Validate before tool runs
  - PostToolUse: React after tool completes
  - Block dangerous commands
  - Run linters after edits
  - Notify on commits

  Hooks are your safety net for autonomous AI.

limits:
  max_duration_minutes: 15
  max_claude_messages: 20
