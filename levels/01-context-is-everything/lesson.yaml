id: "context-is-everything"
number: 1
module: "Mental Model"
title: "Context is Everything"

video:
  url: "https://vimeo.com/placeholder"
  duration_seconds: 300

exercise:
  intro: |
    See how CLAUDE.md instructions directly shape Claude's behavior.
    You'll modify CLAUDE.md and observe the impact.
  objective: "Modify CLAUDE.md and observe how it changes Claude's output"

intro: |
  CLAUDE.md is loaded at the start of every session.
  It's your primary way to customize Claude's behavior for a project.

  Experiment:

  1. Start Claude: `claude`
     (First time? Paste your API key when prompted)
  2. Ask: "Write a function to calculate total expenses"
     → Notice the variable naming (likely snake_case - Python default)
  3. Exit Claude (Esc twice)
  4. Edit CLAUDE.md - add this line under Code Style:
     "Use camelCase for all variable names"
  5. Start a NEW Claude session: `claude`
  6. Ask the same question: "Write a function to calculate total expenses"
     → Does Claude now use camelCase?

  Key insight: CLAUDE.md changes require a new session to take effect.

verification:
  - type: file_contains
    path: "CLAUDE.md"
    pattern: "camelCase"
  - type: min_user_messages
    min_count: 2

success: |
  You've seen how CLAUDE.md shapes Claude's behavior!

  Key insights:
  - CLAUDE.md is read once at session start
  - Changes require starting a new session
  - This is your main tool for project-specific customization

  Common CLAUDE.md uses:
  - Code style preferences (naming, formatting)
  - Project terminology and conventions
  - Testing requirements
  - Architecture guidelines

limits:
  max_duration_minutes: 15
  max_claude_messages: 30
