id: "context-is-everything"
number: 1
module: "Mental Model"
title: "Context is Everything"

video:
  url: "https://vimeo.com/placeholder"
  duration_seconds: 300

exercise:
  intro: |
    Prove that CLAUDE.md instructions get "forgotten" when context fills up.
    Watch Claude follow rules at first, then lose them as you load data.
  objective: "Experience context limits through CLAUDE.md instruction degradation"

intro: |
  LLMs have NO persistent memory. Only what fits in the context window matters.

  When the context fills up, early instructions (like CLAUDE.md) can get
  "lost in the middle" - Claude literally stops following them.

  Let's prove it with an experiment:

  1. Open the exercise folder: cd levels/01-context-is-everything/exercise
  2. Start Claude: claude
  3. Ask: "What does this project do?"
  4. Notice Claude ends with [EXPENSE_TRACKER_ACTIVE] (from .claude/CLAUDE.md)
  5. Now say: "Read all the expense files in historical_data/ and give me a
     complete year-by-year breakdown of spending trends. Read every file."
  6. Claude will read 58 monthly JSON files (~150k tokens of data)
  7. After it finishes, ask: "What's the most common expense category?"
  8. Check: Is the [EXPENSE_TRACKER_ACTIVE] tag still there?

  The CLAUDE.md instruction got pushed out of Claude's "attention window."

verification:
  - type: message_exists
  - type: tool_called
    tool_name: Read

hints:
  - after_minutes: 2
    text: "First ask 'What does this project do?' - look for [EXPENSE_TRACKER_ACTIVE] at the end"
  - after_minutes: 5
    text: "Ask Claude to read ALL 58 files in historical_data/ and summarize spending by year"
  - after_minutes: 10
    text: "Once Claude finishes reading, ask any follow-up question and check if the tag is still there"

success: |
  You witnessed CLAUDE.md instruction degradation!

  What happened:
  - At first, Claude followed the CLAUDE.md instruction (included the tag)
  - After reading ~150k tokens of expense data, the context filled up
  - The CLAUDE.md instruction got pushed to the "middle" of context
  - Claude's attention shifted away from those early instructions

  Key insight: Context is finite. Instructions at the start can be
  "forgotten" when the middle fills with data. This is why:

  1. Keep CLAUDE.md concise - essential rules only
  2. Repeat critical instructions if context gets large
  3. Use /compact or /clear to reset when context bloats
  4. Structure prompts so key info isn't buried in the middle

limits:
  max_duration_minutes: 20
  max_claude_messages: 30
