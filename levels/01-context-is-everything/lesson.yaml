id: "context-is-everything"
number: 1
module: "Mental Model"
title: "Context is Everything"

video:
  url: "https://vimeo.com/placeholder"
  duration_seconds: 300

exercise:
  intro: |
    Observe how CLAUDE.md instructions degrade as context fills up.
    Watch Claude follow terminology rules at first, then drift as you load data.
  objective: "Experience context limits through CLAUDE.md instruction degradation"

intro: |
  LLMs have NO persistent memory. Only what fits in the context window matters.

  The CLAUDE.md file tells Claude to use "transactions" instead of "expenses"
  when explaining this codebase. Let's see if Claude follows this as context fills.

  Experiment:

  1. Start Claude: claude
  2. Ask: "What does this project do?"
     → Notice Claude should say "transactions" (following CLAUDE.md)
  3. Now fill the context by reading historical data:
     "Read all files in historical_data/ and summarize spending by year"
  4. After Claude reads many files, ask: "Explain how adding works"
     → Does Claude still say "transactions" or does it slip back to "expenses"?

  Check context usage with: /cost

  The more context fills up, the less reliably Claude follows early instructions.

verification:
  - type: message_exists
  - type: tool_called
    tool_name: Read
    min_count: 15  # Require reading many files to fill context

hints:
  - after_minutes: 2
    text: "Ask 'What does this project do?' - does Claude say 'transactions' or 'expenses'?"
  - after_minutes: 5
    text: "Now ask Claude to read ALL the historical_data/ files to fill context"
  - after_minutes: 10
    text: "After reading files, ask another question. Is Claude still using 'transactions'?"

success: |
  You observed CLAUDE.md instruction degradation!

  What you may have noticed:
  - Early on, Claude followed the "transactions" terminology from CLAUDE.md
  - As context filled with historical data, adherence may have dropped
  - Claude might slip back to saying "expenses" instead of "transactions"

  Key insight: Context is finite. Instructions at the start can lose
  influence as the context window fills with other content.

  Strategies to combat this:
  1. Keep CLAUDE.md concise - essential rules only
  2. Repeat important instructions in your prompts
  3. Use /compact to reset when context gets large
  4. Front-load critical context, not just early in CLAUDE.md

limits:
  max_duration_minutes: 20
  max_claude_messages: 30
