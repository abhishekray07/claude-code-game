id: "context-is-everything"
number: 1
module: "Mental Model"
title: "Context is Everything"

video:
  url: "https://vimeo.com/placeholder"
  duration_seconds: 300

exercise:
  intro: |
    Observe how CLAUDE.md instructions can drift as context fills up.
    This is an observation exercise to build intuition.
  objective: "Experience context limits through CLAUDE.md instruction adherence"

intro: |
  LLMs have NO persistent memory. Only what fits in the context window matters.

  The CLAUDE.md file has two unusual instructions:
  - Use "transactions" instead of "expenses"
  - Use camelCase (not snake_case) in code examples

  Experiment:

  1. Start Claude: claude
  2. Ask: "What does this project do?"
     → Does Claude say "transactions"? (Check CLAUDE.md adherence)
  3. Ask: "Show me example code for adding an expense"
     → Does Claude use camelCase variables?
  4. Fill context: "Read all files in historical_data/ and summarize by month"
  5. After reading, ask: "Show me how the delete function works"
     → Still using "transactions" and camelCase?

  Use /context to check context usage.

verification:
  - type: message_exists

hints:
  - after_minutes: 2
    text: "Try asking for code examples - does Claude use camelCase or snake_case?"
  - after_minutes: 5
    text: "Read the historical_data/ files to fill context, then ask more questions"
  - after_minutes: 8
    text: "Use /context to see how full the context window is"

success: |
  You explored context and instruction adherence!

  Key insights:
  - CLAUDE.md instructions are read at session start
  - As context fills, early instructions can lose influence
  - Claude may drift back to defaults (snake_case, "expenses")

  Strategies for real projects:
  1. Keep CLAUDE.md concise - prioritize what matters
  2. Repeat critical instructions in prompts when context is large
  3. Use /compact to reset when context gets bloated
  4. Monitor context usage with /context

limits:
  max_duration_minutes: 15
  max_claude_messages: 30
