[project]
name = "claude-code-game"
version = "0.1.0"
description = "Interactive terminal-based game for learning Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "modal>=0.66.0",
    "pyyaml>=6.0.1",
    "wsproto>=1.3.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
]
