<!DOCTYPE html>
<html>
  <head>
    <title>WebSocket Proxy Test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        background: #1a1a2e;
        color: #fff;
      }
      h1 {
        color: #6366f1;
      }
      input {
        padding: 10px;
        width: 300px;
        border-radius: 5px;
        border: 1px solid #333;
        background: #0f0f1a;
        color: #fff;
      }
      button {
        padding: 10px 20px;
        border-radius: 5px;
        border: none;
        background: #6366f1;
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #4f46e5;
      }
      pre {
        background: #0f0f1a;
        padding: 15px;
        border-radius: 5px;
        max-height: 300px;
        overflow-y: auto;
        font-size: 14px;
      }
      .status {
        padding: 5px 10px;
        border-radius: 3px;
        display: inline-block;
        margin-bottom: 10px;
      }
      .connected {
        background: #10b981;
      }
      .disconnected {
        background: #ef4444;
      }
      .connecting {
        background: #f59e0b;
      }
    </style>
  </head>
  <body>
    <h1>WebSocket Proxy Test</h1>
    <p>This tests WebSocket connectivity between browser and server.</p>

    <div id="status" class="status connecting">Connecting...</div>

    <div style="margin: 20px 0">
      <input type="text" id="msg" placeholder="Type a message" />
      <button onclick="send()">Send</button>
    </div>

    <h3>Log:</h3>
    <pre id="log"></pre>

    <script>
      const log = document.getElementById("log");
      const status = document.getElementById("status");

      function addLog(msg, type = "info") {
        const timestamp = new Date().toLocaleTimeString();
        const prefix =
          type === "send" ? "→" : type === "receive" ? "←" : type === "error" ? "✗" : "•";
        log.textContent += `[${timestamp}] ${prefix} ${msg}\n`;
        log.scrollTop = log.scrollHeight;
      }

      function setStatus(state, text) {
        status.className = "status " + state;
        status.textContent = text;
      }

      const ws = new WebSocket("ws://localhost:8765");

      ws.onopen = () => {
        setStatus("connected", "Connected");
        addLog("Connected to WebSocket server");
      };

      ws.onmessage = (e) => {
        addLog(e.data, "receive");
      };

      ws.onerror = (e) => {
        setStatus("disconnected", "Error");
        addLog("WebSocket error", "error");
      };

      ws.onclose = () => {
        setStatus("disconnected", "Disconnected");
        addLog("Disconnected from server");
      };

      function send() {
        const input = document.getElementById("msg");
        const msg = input.value.trim();
        if (msg && ws.readyState === WebSocket.OPEN) {
          ws.send(msg);
          addLog(msg, "send");
          input.value = "";
        }
      }

      // Allow Enter to send
      document.getElementById("msg").addEventListener("keypress", (e) => {
        if (e.key === "Enter") send();
      });
    </script>
  </body>
</html>
