# fly.toml - Fly.io configuration for Claude Code Game sandbox
# This app serves as the base image for on-demand game machines

app = "claude-game-sandbox"
primary_region = "sjc"

[build]
  dockerfile = "fly-sandbox/Dockerfile"

[http_service]
  internal_port = 7681
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
